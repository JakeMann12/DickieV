name: Build and release firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          rm -rf /tmp/dickievrepo
          git clone --branch "${{ github.ref }}" --single-branch "https://github.com/${{ github.repository }}.git" /tmp/dickievrepo
          cd /tmp/dickievrepo
          git checkout "${{ github.sha }}"
          rm -rf "$GITHUB_WORKSPACE"/*
          cp -a /tmp/dickievrepo/. "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"

      - name: Install Python and platform tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python3-pip gh

      - name: Install PlatformIO
        run: pip3 install platformio

      - name: Build firmware
        run: pio run -e esp12e

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp .pio/build/esp12e/firmware.bin dist/firmware.bin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" dist/firmware.bin --title "Firmware v${{ github.run_number }}" --notes "Firmware build ${{ github.run_number }}"
