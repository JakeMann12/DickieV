name: Build and release firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          rm -rf /tmp/dickievrepo
          git clone --branch "${{ github.ref_name }}" --single-branch "https://github.com/${{ github.repository }}.git" /tmp/dickievrepo
          cd /tmp/dickievrepo
          git checkout "${{ github.sha }}"
          rm -rf "$GITHUB_WORKSPACE"/*
          cp -a /tmp/dickievrepo/. "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"

      - name: Install Python and platform tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python3-pip gh

      - name: Install PlatformIO
        run: pip3 install platformio

      - name: Generate WiFi credentials header
        env:
          WIFI_SECRETS: ${{ secrets.WIFI_SECRETS }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          data = os.environ.get("WIFI_SECRETS", "").strip()
          if not data:
              raise SystemExit("WIFI_SECRETS is empty. Add the secret in GitHub Actions repository settings.")

          lines = [line.strip() for line in data.splitlines() if line.strip()]
          if not lines:
              raise SystemExit("WIFI_SECRETS does not contain any WiFi entries.")

          networks = []
          for line in lines:
              if "|" not in line:
                  raise SystemExit(f"Bad WiFi entry format: {line!r}. Expected SSID|PASSWORD")
              ssid, password = [part.strip() for part in line.split("|", 1)]
              if not ssid or not password:
                  raise SystemExit(f"Invalid WiFi entry: {line!r}")
              networks.append((ssid, password))

          header = [
              "#pragma once",
              "",
              "struct WifiNetwork {",
              "  const char* ssid;",
              "  const char* password;",
              "};",
              "",
              "const WifiNetwork wifiNetworks[] = {",
          ]

          for ssid, password in networks:
              esc_ssid = ssid.replace("\\", "\\\\").replace('"', '\\"')
              esc_password = password.replace("\\", "\\\\").replace('"', '\\"')
              header.append('  {"' + esc_ssid + '", "' + esc_password + '"},')

          header.append("};")
          Path("include").mkdir(exist_ok=True)
          Path("include/wifi_credentials.h").write_text("\n".join(header) + "\n")
          PY

      - name: Sync firmware version from run number
        run: |
          sed -i 's|const char\* FIRMWARE_VERSION = ".*"|const char* FIRMWARE_VERSION = "${{ github.run_number }}"|' src/main.cpp
          grep FIRMWARE_VERSION src/main.cpp

      - name: Build firmware
        run: pio run -e esp12e

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp .pio/build/esp12e/firmware.bin dist/firmware.bin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" dist/firmware.bin --title "Firmware v${{ github.run_number }}" --notes "Firmware build ${{ github.run_number }}"
